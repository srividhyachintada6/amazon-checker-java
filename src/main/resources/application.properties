# ===================================================================
# Amazon Availability Checker Configuration (Phase 7 Production-Ready)
# ===================================================================

# Web Server Port (Uses PORT env var provided by Render/Railway/Heroku/AWS, defaults to 8080)
server.port=${PORT:8080}

# Automatic Monitoring Schedule (in minutes, override via CHECKER_SCHEDULE_MINUTES)
checker.schedule.minutes=${CHECKER_SCHEDULE_MINUTES:30}

# Enable/Disable Automatic Scheduler
checker.schedule.enabled=true

# Database Configuration (Defaults to local H2 file database if DATABASE_URL is not set)
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/amazon_checker_db;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# Spring Data JPA & Hibernate
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.hbm2ddl.auto=update

# CORS Allowed Origins (comma-separated, override via FRONTEND_URL or ALLOWED_ORIGINS)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000,http://localhost:8080,http://localhost:5173,https://*.vercel.app}
